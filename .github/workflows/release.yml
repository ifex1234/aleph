name: Release

# Ship a release by bumping "version" in package.json, then:
#   git tag v0.8.3
#   git push origin v0.8.3
# Tag name should match package.json (vX.Y.Z ↔ X.Y.Z). Installers are
# published to GitHub Releases under stable filenames (see `artifactName`
# in electron-builder.yml), which is where users download the app and
# where the in-app updater looks for new versions.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        # macOS runners are Apple Silicon; the dmg is arm64-only.
        include:
          - os: windows-latest
            artifact: installer-windows
          - os: macos-latest
            artifact: installer-macos
          - os: ubuntu-latest
            artifact: installer-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Download Bible sources
        run: bun run data/download-sources.ts

      - name: Build databases
        run: |
          bun run data/build-bible-db.ts
          bun run data/build-hymns-db.ts

      # NOTE: --publish never here. Publishing inside the matrix used to
      # create one GitHub release PER platform job for the same tag, so
      # `/releases/latest/download/<file>` 404'd for whichever assets
      # landed outside the object GitHub picked. All installers are
      # published exactly once by the `publish` job below.
      - name: Provide whisper.cpp CLI
        run: |
          bun run download:whisper-bin
          bun run electron/scripts/build-whisper-cli.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build installer (no publish)
        run: npm run dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers

      # Single release object for the tag: every platform asset plus the
      # electron-updater metadata (latest*.yml, blockmaps) lands together,
      # so direct download links and in-app updates resolve every file.
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: installers/**/*
