<svg width="1280" height="720" viewBox="0 0 1280 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Aleph slides panel with announcement thumbnails">
  <defs>
    <linearGradient id="th1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#450A0A"/>
      <stop offset="1" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="th2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E1B4B"/>
      <stop offset="1" stop-color="#4338CA"/>
    </linearGradient>
    <linearGradient id="th3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#052E16"/>
      <stop offset="1" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="th4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B0764"/>
      <stop offset="1" stop-color="#A21CAF"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="720" fill="#010106"/>
  <rect x="320" y="36" width="640" height="648" rx="12" fill="#18181B" stroke="#26262B" stroke-width="1.5"/>
  <text x="352" y="88" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="600" fill="#FFFFFF">Slides</text>
  <text x="928" y="88" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="26" fill="#9F9FA9">✕</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="352" y="112" width="280" height="158" rx="8" fill="url(#th1)" stroke="#FB2C36" stroke-width="2.5"/>
    <text x="364" y="140" font-size="18" font-weight="600" fill="#FFFFFF">Welcome</text>
    <text x="364" y="252" font-size="15" fill="#FFFFFF" opacity="0.85">1</text>
    <rect x="360" y="216" width="104" height="26" rx="13" fill="#FB2C36"/>
    <text x="412" y="234" text-anchor="middle" font-size="14" font-weight="600" fill="#FFFFFF">On screen</text>
    <rect x="648" y="112" width="280" height="158" rx="8" fill="url(#th2)"/>
    <text x="660" y="140" font-size="18" font-weight="600" fill="#FFFFFF">Announcements</text>
    <text x="660" y="252" font-size="15" fill="#FFFFFF" opacity="0.85">2</text>
    <rect x="352" y="286" width="280" height="158" rx="8" fill="url(#th3)"/>
    <text x="364" y="314" font-size="18" font-weight="600" fill="#FFFFFF">Youth Night</text>
    <text x="364" y="426" font-size="15" fill="#FFFFFF" opacity="0.85">3</text>
    <rect x="648" y="286" width="280" height="158" rx="8" fill="url(#th4)"/>
    <text x="660" y="314" font-size="18" font-weight="600" fill="#FFFFFF">Offering</text>
    <text x="660" y="426" font-size="15" fill="#FFFFFF" opacity="0.85">4</text>
  </g>
  <text x="352" y="500" font-family="Inter, Arial, sans-serif" font-size="16" fill="#9F9FA9">4 slides — click a slide to present it live</text>
  <g font-family="Inter, Arial, sans-serif" font-size="18" fill="#9F9FA9">
    <text x="352" y="548">‹</text>
    <text x="640" y="548" text-anchor="middle">1 / 4</text>
    <text x="928" y="548" text-anchor="end">›</text>
  </g>
