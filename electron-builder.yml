appId: com.zeravest.aleph
productName: Aleph
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build-resources

files:
  - build/**
  - dist-electron/**
  - package.json

# Native/prebuilt modules must live outside the asar for their binaries to load.
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/@huggingface/transformers/**
  - node_modules/onnxruntime-common/**
  - node_modules/onnxruntime-web/**

extraResources:
  # Bible + hymnal databases, resolved at runtime from the resources dir.
  # Kept top-level: every platform ships the same data files. Native
  # binaries below are split per platform (platform lists merge with this
  # one) so installers don't carry other OSs' runtimes.
  - from: data/aleph.db
    to: aleph.db
  - from: data/hymns.db
    to: hymns.db

# Updates are served from GitHub Releases (see .github/workflows/release.yml).
# electron-updater in the packaged app checks these releases and prompts
# to restart once a newer version has downloaded.
publish:
  provider: github
  owner: ifex1234
  repo: aleph
  # Publish immediately on tag push so users can download and auto-update
  # picks it up (auto-updater ignores drafts and prereleases).
  releaseType: release

win:
  target:
    - nsis
  icon: build-resources/icons/icon.ico
  # Stable installer filename across versions so the website's direct
  # download link never goes stale when the version number changes.
  artifactName: "Aleph-windows-x64-setup.${ext}"
  extraResources:
    # Whisper.cpp CLI + runtime DLLs, resolved via resourceDir()/whisper.
    # Windows-only: macOS/Linux builds ship without the CLI and the app
    # falls back to its install guidance (see download-whisper-bin.ts).
    - from: sdk/whisper/win32
      to: whisper
    # NDI runtime library, loaded dynamically via koffi.
    - from: sdk/ndi/windows/Processing.NDI.Lib.x64.dll
      to: ndi/Processing.NDI.Lib.x64.dll

nsis:
  # Small delta downloads instead of the full installer on every update.
  differentialPackage: true

mac:
  target:
    - dmg
  icon: build-resources/icons/icon.icns
  category: public.app-category.reference
  artifactName: "Aleph-macos-arm64.${ext}"
  extraResources:
    - from: sdk/ndi/macos/libndi.dylib
      to: ndi/libndi.dylib
    # whisper-cli, built from source in CI (release.yml) — same layout
    # the app resolves first via resourceDir()/whisper.
    - from: sdk/whisper/macos
      to: whisper

linux:
  target:
    - AppImage
  icon: build-resources/icons
  category: Utility
  artifactName: "Aleph-linux-x86_64.${ext}"
  extraResources:
    - from: sdk/ndi/linux/libndi.so
      to: ndi/libndi.so
    - from: sdk/whisper/linux
      to: whisper

npmRebuild: true
