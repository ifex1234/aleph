appId: com.zeravest.aleph
productName: Aleph
copyright: Copyright © 2026

directories:
  output: release
  buildResources: build-resources

files:
  - build/**
  - dist-electron/**
  - package.json

# Native/prebuilt modules must live outside the asar for their binaries to load.
asarUnpack:
  - node_modules/onnxruntime-node/**
  - node_modules/@huggingface/transformers/**
  - node_modules/onnxruntime-common/**
  - node_modules/onnxruntime-web/**

extraResources:
  # Bible database, resolved at runtime from the resources dir.
  - from: data/aleph.db
    to: aleph.db
  # Hymnal database, resolved at runtime from the resources dir.
  - from: data/hymns.db
    to: hymns.db
  # Whisper.cpp CLI + runtime DLLs, resolved via resourceDir()/whisper in packaged app.
  - from: sdk/whisper/win32
    to: whisper
  # NDI runtime library, loaded dynamically via koffi.
  - from: sdk/ndi/windows/Processing.NDI.Lib.x64.dll
    to: ndi/Processing.NDI.Lib.x64.dll
  - from: sdk/ndi/macos/libndi.dylib
    to: ndi/libndi.dylib
  - from: sdk/ndi/linux/libndi.so
    to: ndi/libndi.so

# Updates are served from GitHub Releases (see .github/workflows/release.yml).
# electron-updater in the packaged app checks these releases and prompts
# to restart once a newer version has downloaded.
publish:
  provider: github
  owner: ifex1234
  repo: aleph
  # Publish immediately on tag push so users can download and auto-update
  # picks it up (auto-updater ignores drafts and prereleases).
  releaseType: release

win:
  target:
    - nsis
  icon: build-resources/icons/icon.ico

nsis:
  # Small delta downloads instead of the full installer on every update.
  differentialPackage: true

mac:
  target:
    - dmg
  icon: build-resources/icons/icon.icns
  category: public.app-category.reference

linux:
  target:
    - AppImage
  icon: build-resources/icons
  category: Utility

npmRebuild: true
